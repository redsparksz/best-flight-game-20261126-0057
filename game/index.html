<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Senja Terakhir di Lembah Kala — Flight Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1d2340;
    font-family: "Segoe UI", system-ui, sans-serif; color: #f2e8d8; }
  #game, #game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: rgba(12, 14, 26, 0.62); border: 1px solid rgba(255, 179, 71, 0.45);
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(2px); }
  .panel-title { font-size: 11px; letter-spacing: 2px; color: #ffb347; font-weight: 700; }
  #hud-top { position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #mission-panel, #score-panel { min-width: 190px; }
  #mission-rings, #mission-time { font-size: 15px; margin-top: 4px; }
  #mission-rings b, #mission-time b { color: #ffd98a; }
  #score-value { font-size: 30px; font-weight: 800; color: #ffd98a; line-height: 1.1; }
  #compass { background: rgba(12, 14, 26, 0.62); border: 1px solid rgba(255, 179, 71, 0.45); border-radius: 8px; }
  #hud-right { position: absolute; top: 96px; right: 12px; display: flex;
    flex-direction: column; gap: 10px; align-items: flex-end; }
  .gauge { width: 172px; text-align: right; }
  .gauge .label { font-size: 11px; letter-spacing: 2px; color: #ffb347; font-weight: 700; }
  .gauge .big { font-size: 26px; font-weight: 800; color: #ffe9b8;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .gauge .sub { font-size: 12px; color: #d8cbb2; font-family: ui-monospace, Consolas, monospace; }
  #fuel-bar { height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; margin-top: 6px; overflow: hidden; }
  #fuel-fill { height: 100%; width: 100%; background: #ffb347; transition: width 0.3s; }
  #attitude { background: rgba(12, 14, 26, 0.62); border: 1px solid rgba(255, 179, 71, 0.45); border-radius: 50%; }
  #hud-bottom { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; }
  #message { display: inline-block; background: rgba(12, 14, 26, 0.72); border: 1px solid rgba(255, 179, 71, 0.6);
    color: #ffe9b8; font-size: 16px; font-weight: 600; padding: 8px 18px; border-radius: 20px;
    opacity: 0; transition: opacity 0.4s; max-width: 80%; }
  #hint { margin-top: 8px; font-size: 12px; color: rgba(242, 232, 216, 0.75); text-shadow: 0 1px 3px #000; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 10, 24, 0.45); pointer-events: auto; }
  .overlay.hidden { display: none; }
  .card { background: rgba(14, 16, 32, 0.88); border: 1px solid rgba(255, 179, 71, 0.55);
    border-radius: 16px; padding: 30px 36px; max-width: 560px; text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  .kicker { font-size: 12px; letter-spacing: 3px; color: #ffb347; font-weight: 700; }
  .card h1 { font-size: 40px; line-height: 1.1; margin: 10px 0 14px; color: #ffe9b8; }
  .story { font-size: 15px; line-height: 1.55; color: #e8dcc4; }
  .story b { color: #ffb347; }
  .controls { margin: 18px 0; font-size: 14px; line-height: 1.9; color: #d8cbb2;
    background: rgba(255,255,255,0.06); border-radius: 10px; padding: 10px; }
  .controls b { color: #ffd98a; font-family: ui-monospace, Consolas, monospace; }
  button { pointer-events: auto; cursor: pointer; background: linear-gradient(180deg, #ff8a2a, #e85d10);
    color: #fff; border: none; border-radius: 10px; padding: 14px 34px; font-size: 17px; font-weight: 800;
    letter-spacing: 1px; margin-top: 6px; box-shadow: 0 6px 20px rgba(232, 93, 16, 0.45); }
  button:hover { filter: brightness(1.12); }
  .fine { margin-top: 14px; font-size: 12px; color: rgba(216, 203, 178, 0.7); }
  #end-breakdown { margin: 16px 0 8px; text-align: left; font-size: 14px; }
  #end-breakdown .row { display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  #end-breakdown .row b { color: #ffd98a; }
  #end-breakdown .row.total { font-size: 18px; border-bottom: none; padding-top: 10px; }
  #end-breakdown .row.total b { font-size: 22px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
